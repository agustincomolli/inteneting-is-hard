<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlexBox</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="navbar">
    <ul class="menu">
      <p class="date">30 de Abril de 2025</p>
      <div class="links">
        <li class="menu-item login"><a href="" class="menu-link">Iniciar sesión</a></li>
        <li class="menu-item signup"><a href="" class="menu-link">Registrarse</a></li>
      </div>
    </ul>
  </nav>

  <header class="header">
    <div class="header-wrapper">
      <section class="subscribe">Subscríbete &#9662;</section>
      <section class="logo"><img src="./images/awesome-logo.svg" alt="logo"></section>
      <section class="social"><img src="./images/social-icons.svg" alt=""></section>
    </div>
  </header>

  <main class="main">
    <div class="gallery">
      <div class="photo-card first-item"><img src="./images/one.svg" alt="Photo 1"></div>
      <div class="photo-card"><img src="./images/two.svg" alt="Photo 2"></div>
      <div class="photo-card"><img src="./images/three.svg" alt="Photo 3"></div>
      <div class="photo-card"><img src="./images/four.svg" alt="Photo 4"></div>
      <div class="photo-card last-item"><img src="./images/five.svg" alt="Photo 5"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-item footer-1"></div>
    <div class="footer-item footer-2"></div>
    <div class="footer-item footer-3"></div>
  </footer>
</body>

</html>
