<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posicionamiento avanzado</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="brand">
      <img src="./images/awesome-logo.svg" alt="logo" class="logo">
    </div>
    <nav class="navbar">
      <ul class="menu">
        <li class="menu-item dropdown">
          <span class="submenu-text">Características ▾</span>
          <ul class="feature-menu">
            <li class="menu-item"><a href="#" class="menu-link">Muy buena</a></li>
            <li class="menu-item"><a href="#" class="menu-link">Buena</a></li>
            <li class="menu-item"><a href="#" class="menu-link">Regular</a></li>
            <li class="menu-item"><a href="#" class="menu-link">Mala</a></li>
          </ul>
        </li>
        <li class="menu-item"><a class="menu-link" href="#">Blog</a></li>
        <li class="menu-item"><a class="menu-link" href="#">Suscríbete</a></li>
        <li class="menu-item"><a class="menu-link" href="#">Acerca de...</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <div class="example relative">
      <div class="item"><img src="./images/static.svg" alt="Static"></div>
      <div class="item item-relative"><img src="./images/relative.svg" alt="Relative"></div>
      <div class="item"><img src="./images/static.svg" alt="Static"></div>
    </div>
  </div>

  <div class="container">
    <div class="example absolute">
      <div class="item"><img src="./images/static.svg" alt="Static"></div>
      <div class="item item-absolute"><img src="./images/absolute.svg" alt="Absolute"></div>
      <div class="item"><img src="./images/static.svg" alt="Static"></div>
    </div>
  </div>

  <div class="container">
    <div class="example fixed">
      <div class="item"><img src="./images/static.svg" alt="Static"></div>
      <div class="item item-fixed"><img src="./images/fixed.svg" alt="Fixed"></div>
      <div class="item"><img src="./images/static.svg" alt="Static"></div>
    </div>
  </div>

  <script>
    var left = 0;

    function frame() {
      var element = document.querySelector('.item-relative');
      left += 2;
      element.style.left = left + 'px';
      if (left >= 300) {
        clearInterval(id)
      }
    }

    var id = setInterval(frame, 10)
  </script>
</body>

</html>
